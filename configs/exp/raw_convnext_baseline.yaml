experiment:
  name: "raw_baseline"
  seed: 42

data:
  canonicalize: false

model:
  backbone: "convnext_tiny.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "none"
  drop_path_rate: 0.1

augmentation:
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 32
  learning_rate: 2e-4
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  num_workers: 0
  n_folds: 5
