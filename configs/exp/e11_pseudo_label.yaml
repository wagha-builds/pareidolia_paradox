# E11 — Pseudo-labeling: E5 + high-confidence test images as extra training data
# Parent: E5 (e5_convnext_film.yaml)
# Change: training.pseudo_label_csv = data/pseudo_labels.csv (808 test images, p<0.30 or p>0.70)
#
# Hypothesis:
#   Test images with p < 0.30 (Depth) or p > 0.70 (Rise) are high-confidence predictions
#   from the E4+E5+Swin ensemble. Adding them as training signal fills azimuth gaps:
#   - Az 270-360: 163 extra craters (our worst quadrant — sparse training coverage)
#   - Az 90-180:  594 extra mounds (dominant direction, but model is already good there)
#   Expected gain: +1–3 BA points if pseudo-labels are correct, mostly driven by
#   the 163 Az=270-360 crater pseudo-labels plugging the canonical shortcut gap.
#
# Rules Q3: YES — test images may be used for pseudo-labeling / transductive methods.
# Decision rule: adopt if fold-0 screen beats E5-s42 (0.7737) by >0.5 pt.

experiment:
  name: "e11_pseudo_label"
  seed: 42

data:
  canonicalize: true

model:
  backbone: "convnext_tiny.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "film"
  drop_path_rate: 0.1
  film_hidden: 64

augmentation:
  p_vflip: 0.25
  p_neg: 0.15
  p_hflip: 0.50
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 32
  learning_rate: 5.0e-5
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  warmup_epochs: 3
  num_workers: 0
  n_folds: 5
  pseudo_label_csv: "data/pseudo_labels.csv"
