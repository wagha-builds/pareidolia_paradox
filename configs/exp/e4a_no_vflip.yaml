# E4a Ablation — Canonical ConvNeXt-T without Vertical Flip Label Swap
# Parent: E4 (configs/exp/e4_canonical_convnext.yaml)
# Change: augmentation.p_vflip = 0.0 (all other parameters identical to E4)
#
# Hypothesis:
#   Removing vertical flip label-swap tests whether the model relies heavily
#   on geometric relief-inversion to learn crater/mound distinction, or if
#   photometric negation alone is sufficient.
#
# Rule: Change exactly ONE thing relative to parent (AGENTS.md §5).

experiment:
  name: "e4a_no_vflip"
  seed: 42

data:
  canonicalize: true

model:
  backbone: "convnext_tiny.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "none"
  drop_path_rate: 0.1

augmentation:
  p_vflip: 0.0          # ABLATION: no vertical flip label swap
  p_neg: 0.15           # photometric negation → label swap
  p_hflip: 0.50         # horizontal flip → label unchanged
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 32
  learning_rate: 5.0e-5
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  warmup_epochs: 3
  num_workers: 0
  n_folds: 5
