# E12 — ConvNeXt-Small + FiLM: larger backbone capacity
# Parent: E5 (e5_convnext_film.yaml)
# Change: backbone convnext_tiny -> convnext_small (~2x parameters: 28M vs 13M)
#
# Hypothesis:
#   ConvNeXt-Tiny has 28M parameters total; the classifier backbone is ~13M.
#   ConvNeXt-Small has ~50M total. For 256x256 grayscale patches with subtle
#   photometric cues (shadow gradients, rim brightness), a larger backbone
#   should learn more discriminative representations beyond the azimuth shortcut.
#   The ImageNet-21k pretrained weights transfer well to single-channel input
#   (we adapt conv stem from 3 to 1 channel same as E5).
#
# Expected gain: +0.5–2 BA points vs E5 on full CV.
# Risk: overfitting (7854 train images). Mitigate with drop_path_rate=0.2.
# Decision rule: adopt if fold-0 screen beats E5-s42 (0.7737) by >0.5 pt.

experiment:
  name: "e12_convnext_small"
  seed: 42

data:
  canonicalize: true

model:
  backbone: "convnext_small.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "film"
  drop_path_rate: 0.2        # slightly higher regularisation for larger model
  film_hidden: 64

augmentation:
  p_vflip: 0.25
  p_neg: 0.15
  p_hflip: 0.50
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 16             # smaller batch to fit Small on GPU
  learning_rate: 3.0e-5     # slightly lower LR for larger model
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  warmup_epochs: 3
  num_workers: 0
  n_folds: 5
