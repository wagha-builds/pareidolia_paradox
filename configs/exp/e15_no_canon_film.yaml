# E15 — No Canonicalization + FiLM azimuth conditioning
# Parent: E5 (e5_convnext_film.yaml)
# Change: data.canonicalize=false (remove broken canonical rotation, keep FiLM)
#
# Hypothesis:
#   Canonicalization at R=0.176 means only ~3% of sun-angle variance is explained
#   by the azimuth metadata. Most images are being rotated to the WRONG orientation,
#   adding noise to the visual signal. Without canonicalization, the FiLM layer
#   can learn the raw image+azimuth correlation directly, without the noisy
#   intermediate rotation step corrupting spatial features.
#
# Decision rule: adopt if fold-0 screen beats E5-s42 (0.7737) by >0.5 pt (>0.7787).

experiment:
  name: "e15_no_canon_film"
  seed: 42

data:
  canonicalize: false          # KEY CHANGE vs E5

model:
  backbone: "convnext_tiny.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "film"
  drop_path_rate: 0.1
  film_hidden: 64

augmentation:
  p_vflip: 0.25
  p_neg: 0.15
  p_hflip: 0.50
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 32
  learning_rate: 5.0e-5
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  warmup_epochs: 3
  num_workers: 0
  n_folds: 5
