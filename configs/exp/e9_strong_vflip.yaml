# E9 — Canonical ConvNeXt-T + FiLM + Strong Vertical Flip (p_vflip=0.50)
# Parent: E5 (e5_convnext_film.yaml)
# Change: augmentation.p_vflip: 0.25 -> 0.50
#
# Hypothesis:
#   82.5% of craters in the training set are concentrated in azimuth 270°-360°.
#   In the canonical frame (sun at top), CanonicalVerticalFlipLabelSwap (vflip + label swap)
#   physically converts craters to mounds and mounds to craters by flipping the
#   illumination-shadow geometry.
#   Increasing p_vflip from 0.25 to 0.50 doubles the generation of synthetic craters
#   from mounds across all azimuth ranges, directly combating the regional crater deficit.

experiment:
  name: "e9_strong_vflip"
  seed: 42

data:
  canonicalize: true

model:
  backbone: "convnext_tiny.fb_in22k_ft_in1k"
  in_chans: 1
  pretrained: true
  conditioning: "film"
  drop_path_rate: 0.1
  film_hidden: 64

augmentation:
  p_vflip: 0.50
  p_neg: 0.15
  p_hflip: 0.50
  brightness: 0.04
  contrast: 0.08
  noise_std: 0.01

training:
  epochs: 30
  batch_size: 32
  learning_rate: 5.0e-5
  weight_decay: 0.05
  label_smoothing: 0.05
  mixed_precision: "bf16"
  early_stopping_patience: 5
  warmup_epochs: 3
  num_workers: 0
  n_folds: 5
