# Debug Configuration for Smoke Tests
# Tiny config: 1 fold, 5 epochs, 32 batch, no CV

experiment:
  name: "debug"
  seed: 42

data:
  image_size: 256
  canonicalize: false
  corner_mode: "affine_zoom"
  
model:
  backbone: "resnet18" # Fast initialization for debugging
  in_chans: 1
  pretrained: false # Don't download weights during debug
  conditioning: "none"

augmentation:
  brightness: 0.0
  contrast: 0.0
  noise_std: 0.0
  p_vflip: 0.0
  p_neg: 0.0
  p_hflip: 0.0
  
training:
  epochs: 5
  batch_size: 32
  learning_rate: 1e-3
  weight_decay: 0.05
  label_smoothing: 0.0
  drop_path_rate: 0.0
  mixed_precision: "fp16"
  early_stopping_patience: 2
  debug_mode: true # Flag for the training loop to run on a tiny subset
  num_workers: 0   # Windows: mmap + spawn = OSError; keep 0
